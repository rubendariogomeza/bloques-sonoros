name: Publicar en GitHub Pages

# Publica `app/` tal cual: sin build, sin dependencias, sin transpilación.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Empaquetar la app
        uses: actions/upload-pages-artifact@v3
        with:
          path: app

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
